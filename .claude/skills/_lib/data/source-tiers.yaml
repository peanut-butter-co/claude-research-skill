# source-tiers.yaml
# Schema: domain → {tier: A|B|C|D, notes?: str}
# Tiers: A = peer-reviewed / primary source; B = established reference press;
#        C = community / secondary; D = low-quality / SEO farm
---
domains:

  # ─── Tier A: Academic publishers & peer-reviewed sources ───────────────────

  nature.com:
    tier: A
    notes: "Nature Publishing Group — flagship multidisciplinary peer-reviewed journal"

  science.org:
    tier: A
    notes: "AAAS Science — top-tier peer-reviewed multidisciplinary journal"

  springer.com:
    tier: A
    notes: "Springer — large peer-reviewed academic publisher (Springer Nature group)"

  springerlink.com:
    tier: A
    notes: "SpringerLink — Springer's primary article portal for peer-reviewed content"

  sciencedirect.com:
    tier: A
    notes: "ScienceDirect — Elsevier's peer-reviewed journal and book platform"

  elsevier.com:
    tier: A
    notes: "Elsevier — major academic publisher, hosts hundreds of peer-reviewed journals"

  cell.com:
    tier: A
    notes: "Cell Press — Elsevier imprint; flagship Cell journal and family (Cell, Neuron, etc.)"

  thelancet.com:
    tier: A
    notes: "The Lancet — Elsevier imprint; leading peer-reviewed medical journal"

  plos.org:
    tier: A
    notes: "PLOS — open-access peer-reviewed publisher (PLOS ONE, PLOS Biology, etc.)"

  pnas.org:
    tier: A
    notes: "PNAS — Proceedings of the National Academy of Sciences; peer-reviewed"

  wiley.com:
    tier: A
    notes: "Wiley — major academic publisher; broad peer-reviewed journal portfolio"

  onlinelibrary.wiley.com:
    tier: A
    notes: "Wiley Online Library — Wiley's primary peer-reviewed article portal"

  acs.org:
    tier: A
    notes: "American Chemical Society — peer-reviewed chemistry journals (JACS, etc.)"

  pubs.acs.org:
    tier: A
    notes: "ACS Publications — ACS peer-reviewed journal portal"

  ieee.org:
    tier: A
    notes: "IEEE — leading peer-reviewed electrical engineering and computing standards body"

  ieeexplore.ieee.org:
    tier: A
    notes: "IEEE Xplore — IEEE's peer-reviewed article and conference-paper portal"

  dl.acm.org:
    tier: A
    notes: "ACM Digital Library — ACM peer-reviewed CS and IT publications"

  academic.oup.com:
    tier: A
    notes: "Oxford Academic — Oxford University Press peer-reviewed journal portal"

    # also covered by oup.com umbrella
  oup.com:
    tier: A
    notes: "Oxford University Press — top academic publisher, books and journals"

  cambridge.org:
    tier: A
    notes: "Cambridge University Press — peer-reviewed journals and academic books"

  mitpress.mit.edu:
    tier: A
    notes: "MIT Press — peer-reviewed academic books and journals"

  arxiv.org:
    tier: A
    notes: "arXiv — open-access preprint server (physics, maths, CS, econ); not peer-reviewed but primary source"

  pubmed.ncbi.nlm.nih.gov:
    tier: A
    notes: "PubMed — NLM/NCBI index of peer-reviewed biomedical literature"

  ncbi.nlm.nih.gov:
    tier: A
    notes: "NCBI — NIH's bioinformatics and biomedical research databases"

  jstor.org:
    tier: A
    notes: "JSTOR — digital library of peer-reviewed academic journals and primary sources"

  taylorandfrancis.com:
    tier: A
    notes: "Taylor & Francis — large academic publisher; Routledge and T&F journals"

  tandfonline.com:
    tier: A
    notes: "Taylor & Francis Online — T&F peer-reviewed article portal"

  sagepub.com:
    tier: A
    notes: "SAGE Publications — peer-reviewed journals in social sciences and humanities"

  bmj.com:
    tier: A
    notes: "The BMJ (British Medical Journal) — peer-reviewed general medical journal"

  biomedcentral.com:
    tier: A
    notes: "BioMed Central — Springer Nature open-access peer-reviewed publisher"

