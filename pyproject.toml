[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "research-skill"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "PyYAML",
    "python-frontmatter",
    "python-slugify",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = [".claude/skills/_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".claude/skills/_lib"]
addopts = "-q"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
